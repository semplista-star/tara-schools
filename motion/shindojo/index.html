<title>Shin Dojo Motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a single "screening room" column: the 16:9 stage, a transport bar like an editing suite, then the shot list and the voice-over script. */
:root {
  --bosc: #0f1d17;        /* deep forest */
  --bosc-2: #1c3328;
  --nit: #08110d;
  --paper: #ece6d6;
  --paper-dim: #a3a898;
  --ambre: #d6a54a;       /* light between the trees */
  --line: rgba(236, 230, 214, .14);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--nit); }
body {
  background: var(--nit); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4vw, 40px); letter-spacing: .04em; margin: 0; text-wrap: balance; }
h1 span { color: var(--ambre); font-weight: 500; margin-left: .35em; }
.meta { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }

.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--bosc); border: 1px solid var(--line); overflow: hidden; }
.stage canvas, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bigplay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  background: rgba(8, 17, 13, .55); border: 1px solid rgba(236, 230, 214, .5);
  color: var(--paper); cursor: pointer; display: grid; place-items: center;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), background .3s; backdrop-filter: blur(4px);
}
.bigplay:hover { transform: translate(-50%, -50%) scale(1.06); background: rgba(8, 17, 13, .75); }
.bigplay svg { width: 30px; height: 30px; margin-left: 5px; fill: currentColor; }

.transport { display: grid; gap: 10px; }
.acts { display: grid; grid-template-columns: 15fr 25fr 15fr 5fr; gap: 3px; }
.acts button {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--paper-dim); background: transparent; border: 0; border-top: 2px solid var(--line);
  padding: 6px 0 0; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.acts button.on { color: var(--paper); border-top-color: var(--ambre); }
.acts button:focus-visible, .ctrl:focus-visible, .shot:focus-visible, .bigplay:focus-visible, .vo button:focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--ambre); margin: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.ctrl {
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  background: transparent; color: var(--paper); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer;
}
.ctrl:hover { border-color: rgba(236, 230, 214, .4); }
.tc { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 9ch; }
.spacer { flex: 1; }
.status { font-family: var(--mono); font-size: 12px; color: var(--paper-dim); min-height: 1.5em; }

.shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.shot { background: transparent; color: inherit; font: inherit; text-align: left; border: 0; border-right: 1px solid var(--line); padding: 16px 18px 6px 0; margin-right: 18px; cursor: pointer; min-width: 0; display: grid; gap: 6px; align-content: start; }
.shot:last-child { border-right: 0; margin-right: 0; }
.shot .t, .vo .t { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--ambre); font-variant-numeric: tabular-nums; }
.shot h2 { font-family: var(--display); font-size: 20px; font-weight: 800; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.shot p { margin: 0; color: var(--paper-dim); font-size: 14px; }

.vo { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.vo h3 { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim); font-weight: 400; }
.vo ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 28px; }
.vo button { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; color: var(--paper); font: inherit; padding: 5px 0; cursor: pointer; }
.vo button.on { color: var(--ambre); }
.note { font-size: 13px; color: var(--paper-dim); max-width: 72ch; margin: 0; }
.note code { font-family: var(--mono); font-size: 12px; color: var(--paper); }

@media (max-width: 820px) {
  .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shot:nth-child(2) { border-right: 0; margin-right: 0; }
  .vo ol { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .shots { grid-template-columns: minmax(0, 1fr); }
  .shot { border-right: 0; margin-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .acts button { font-size: 9px; letter-spacing: .04em; }
  .bigplay { width: 64px; height: 64px; }
}
</style>

<div class="wrap">
  <header>
    <h1>SHIN DOJO<span>道場</span></h1>
    <div class="meta">Motion · 60 s · 1920×1080 · Canvas + GSAP · VO en català</div>
  </header>

  <div class="stage" id="stageBox">
    <canvas id="stage" width="1920" height="1080" aria-label="Vídeo animat de 60 segons sobre Shin Dojo"></canvas>
    <button class="bigplay" id="bigplay" aria-label="Reprodueix el vídeo"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
  </div>

  <div class="transport">
    <div class="acts" id="acts">
      <button data-t="0">I · Veure</button>

      <button data-t="55">Outro</button>
    </div>
    <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" aria-label="Posició del vídeo">
    <div class="row">

      <span class="tc" id="tc">00:00:00</span>
      <span class="spacer"></span>
      <button class="ctrl" id="full">Pantalla completa</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>

  <div class="shots">
    <button class="shot" data-t="0"><span class="t">00:00 — 00:15</span><h2>I · Veure</h2><p>«No has vingut a canviar. Has vingut a veure.» Un ensō es dibuixa com un ull que s'obre i hi apareix el nom.</p></button>
    <button class="shot" data-t="15"><span class="t">00:15 — 00:40</span><h2>II · El dojo</h2><p>Els nou centres del mapa es construeixen, es fonen en corbes de nivell (el mapa no és el territori), giren en un carrusel 3D amb les tres formes de trobar-se i creixen en bosc.</p></button>
    <button class="shot" data-t="40"><span class="t">00:40 — 00:55</span><h2>III · El mapa</h2><p>El bosc s'accelera mentre passen les preguntes amb què arriba la gent. Comptadors 9 · 36 · 64 i un sol punt de llum: la teva experiència.</p></button>
    <button class="shot" data-t="55"><span class="t">00:55 — 01:00</span><h2>Outro</h2><p>Flaix a paper, ensō en tinta de bosc, «Obrim una conversa» i fosa.</p></button>
  </div>

  <section class="vo" aria-labelledby="voh">
    <h3 id="voh">Guió de veu · ElevenLabs · català</h3>
    <ol id="voList"></ol>
  </section>

  <p class="note">Aquesta previsualització és muda: la veu es genera amb ElevenLabs i es munta a l'MP4 amb <code>node motion/shindojo/scripts/build.mjs</code>. Tecles: <code>espai</code> reprodueix o pausa, <code>←</code>/<code>→</code> salten 5 s.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
'use strict';

/* ───────────── Text of the piece (from shindojo.cat) ───────────── */
const CONFIG = {
  name: 'SHIN DOJO',
  sub: 'DISSENY HUMÀ  ·  TROBADA  ·  PRÀCTICA',
  tagline: 'Comprendre com funcionem. Descobrir noves maneres de mirar.',
  cta: 'Obrim una conversa.',
  url: 'shindojo.cat',
};
/* Voice-over cue sheet. `at` is the planned start in seconds; the build script
   places each ElevenLabs clip there (or right after the previous one if it runs long). */
const VO = [
  { at: 0.9,  text: 'No has vingut a canviar.' },
  { at: 3.4,  text: 'Has vingut a veure.' },
  { at: 6.2,  text: 'Shin Dojo. Un espai de trobada i pràctica per explorar el Disseny Humà.' },
  { at: 11.4, text: 'Per comprendre com funcionem, i descobrir noves maneres de mirar.' },
  { at: 15.6, text: 'Un dojo és el lloc on s\'aprèn a través de la pràctica.' },
  { at: 19.4, text: 'Amb el Disseny Humà com a mapa, i la pròpia experiència com a referència.' },
  { at: 24.6, text: 'Perquè el mapa no és el territori.' },
  { at: 28.6, text: 'Sessions i programes. Famílies. Projectors.' },
  { at: 32.6, text: 'Una mateixa pràctica. Diferents maneres de viure-la.' },
  { at: 36.9, text: 'I el bosc: el dojo sense parets.' },
  { at: 40.4, text: 'Una decisió que demana claredat.' },
  { at: 42.7, text: 'Una relació que voldries comprendre millor.' },
  { at: 45.2, text: 'Gastar més energia de la necessària.' },
  { at: 47.3, text: 'El desig de viure amb menys fricció.' },
  { at: 49.6, text: 'Nou centres. Trenta-sis canals. Seixanta-quatre portes.' },
  { at: 52.6, text: 'I una sola referència: la teva experiència.' },
  { at: 56.2, text: 'Obrim una conversa. Shin Dojo.' },
];
window.VO = VO;

/* ───────────── Setup ───────────── */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 60;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = { bosc: '#0f1d17', bosc2: '#1c3328', nit: '#08110d', paper: '#ece6d6', ambre: '#d6a54a', tinta: '#16291f' };
const FONT = {
  display: '"Shippori Mincho B1", "Yu Mincho", Georgia, serif',
  body: '"Zen Kaku Gothic New", "Segoe UI", system-ui, sans-serif',
  mono: '"DM Mono", ui-monospace, Menlo, monospace',
};

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (v, a, b) => clamp((v - a) / (b - a));
const E = {
  p4o: gsap.parseEase('power4.out'), p3io: gsap.parseEase('power3.inOut'), p3o: gsap.parseEase('power3.out'),
  p2o: gsap.parseEase('power2.out'), p2i: gsap.parseEase('power2.in'), eo: gsap.parseEase('expo.out'),
  sio: gsap.parseEase('sine.inOut'), bo: gsap.parseEase('back.out(1.7)'),
};
const rgb = h => h[0] === '#' ? [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)) : h.match(/\d+/g).slice(0, 3).map(Number);
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ───────────── GSAP master timeline ───────────── */
const S = {};
const tl = gsap.timeline({ paused: true });
function T(p, from, to, at, dur, ease = 'power2.inOut') {
  if (!(p in S)) S[p] = from;
  tl.fromTo(S, { [p]: from }, { [p]: to, duration: dur, ease, immediateRender: false }, at);
}

// ACT I · 0–15
T('l1', 0, 1, 0.7, 1.4, 'power3.out');   T('l1o', 0, 1, 2.8, 0.7, 'power2.in');
T('l2', 0, 1, 3.3, 1.3, 'power3.out');   T('l2o', 0, 1, 5.2, 0.7, 'power2.in');
T('enso', 0, 1, 5.3, 2.9, 'power2.inOut');
T('kanji', 0, 1, 7.2, 1.6, 'expo.out');
T('title', 0, 1, 7.0, 2.2, 'none');
T('sub', 0, 1, 8.6, 1.4, 'power2.out');
T('tag', 0, 1, 11.2, 1.4, 'power2.out');
T('zoom', 1, 1.04, 0, 14.5, 'sine.inOut');
T('i1Out', 0, 1, 13.7, 1.4, 'power2.in');

// ACT II · 15–40
T('dojo', 0, 1, 15.1, 1.4, 'power3.out');
T('bg', 0, 1, 15.8, 3.0, 'none');            // nine centres pop in
T('ch', 0, 1, 17.6, 3.6, 'power1.inOut');    // channels draw
T('def', 0, 1, 21.0, 1.2, 'power2.out');     // some centres become defined
T('copy', 0, 1, 19.3, 1.2, 'power2.out');
T('dojoOut', 0, 1, 23.4, 1.2, 'power2.in');
T('topo', 0, 1, 23.7, 3.2, 'power2.out');
T('mapa', 0, 1, 24.5, 1.4, 'power3.out');
T('mapaOut', 0, 1, 27.5, 0.8, 'power2.in');
T('topoOut', 0, 1, 27.6, 1.4, 'power2.inOut');
T('ringA', 0, 1, 28.1, 1.0, 'power2.out');
T('ring', -0.6, 0, 28.1, 1.7, 'power3.out');
T('ring2', 0, 1, 30.7, 1.1, 'power3.inOut');
T('ring3', 0, 1, 33.2, 1.1, 'power3.inOut');
T('practica', 0, 1, 32.5, 1.0, 'power2.out');
T('ringOut', 0, 1, 35.9, 0.9, 'power2.in');
T('trees', 0, 1, 36.2, 3.0, 'power3.out');
T('bosc', 0, 1, 36.9, 1.2, 'power3.out');
T('boscOut', 0, 1, 39.4, 0.7, 'power2.in');

// ACT III · 40–55
T('dark', 0, 1, 39.6, 1.6, 'power2.inOut');
T('travel', 0, 1, 39.5, 15.0, 'power2.in');
T('cnt', 0, 1, 49.3, 0.7, 'power2.out');
T('cntOut', 0, 1, 52.1, 0.5, 'power2.in');
T('ref', 0, 1, 52.5, 1.0, 'power3.out');
T('bloom', 0, 1, 52.8, 1.8, 'power2.in');
T('treesOut', 0, 1, 53.2, 1.2, 'power2.in');
T('flash', 0, 1, 54.1, 0.45, 'power2.in');
T('paper', 0, 1, 54.55, 0.04, 'none');
T('flashOut', 0, 1, 54.6, 1.2, 'power2.out');

// OUTRO · 55–60
T('oEnso', 0, 1, 55.0, 1.8, 'power2.inOut');
T('oKanji', 0, 1, 55.9, 1.1, 'expo.out');
T('oTitle', 0, 1, 56.0, 1.6, 'none');
T('oCta', 0, 1, 56.9, 1.0, 'power2.out');
T('oUrl', 0, 1, 57.4, 1.1, 'power3.inOut');
T('fade', 0, 1, 58.7, 1.3, 'sine.inOut');
tl.set({}, {}, DUR);

const ASKS = [
  { t: 40.3, d: 2.4, s: 'Una decisió que demana claredat.' },
  { t: 42.6, d: 2.5, s: 'Una relació que voldries comprendre millor.' },
  { t: 45.1, d: 2.1, s: 'Més energia de la necessària.' },
  { t: 47.2, d: 2.0, s: 'Viure amb menys fricció.' },
];

/* ───────────── Precomputed assets ───────────── */
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }
const POLLEN = (() => { const r = rng(42); return Array.from({ length: 120 }, () => ({ x: r() * W, y: r() * H, s: .6 + r() * 2.4, vx: (r() - .5) * 12, vy: -3 - r() * 9, p: r() * 6.28, a: r() < .25 })); })();
const ENSO = (() => { const r = rng(3), N = 520, pts = [];
  const a0 = -Math.PI * 0.58, span = Math.PI * 2 * 0.93;
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1), a = a0 + span * u;
    const rad = 1 + 0.014 * Math.sin(a * 5 + 1) + 0.008 * Math.sin(a * 13);
    const w = (0.25 + 0.75 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.25 + .06)), .5)) * (1 - 0.55 * u) * (0.9 + r() * 0.2);
    pts.push({ a, rad, w });
  }
  return pts; })();
const BRISTLES = [[0, 0, 1], [-.32, .02, .55], [.3, -.03, .5], [-.12, .05, .35], [.18, .04, .35]];

// Nine-centre map (stylised)
const CENTRES = [
  { x: 0, y: -340, t: 'up', s: 60 }, { x: 0, y: -222, t: 'down', s: 60 }, { x: 0, y: -100, t: 'sq', s: 54 },
  { x: 0, y: 25, t: 'dia', s: 58 }, { x: 104, y: 86, t: 'up', s: 34 }, { x: -195, y: 205, t: 'left', s: 56 },
  { x: 0, y: 210, t: 'sq', s: 54 }, { x: 195, y: 205, t: 'right', s: 56 }, { x: 0, y: 335, t: 'sq', s: 54 },
];
const DEFINED = new Set([2, 3, 6, 7]);
const CHANNELS = [[0, 1, 3], [1, 2, 3], [2, 3, 3], [2, 4, 1], [2, 5, 2], [2, 7, 2], [3, 6, 3], [3, 4, 1], [3, 5, 1], [4, 7, 1], [4, 5, 1], [6, 5, 1], [6, 7, 1], [6, 8, 3], [5, 8, 3], [7, 8, 3]];
// Contour peaks (topographic "territory")
const PEAKS = [{ x: CX - 330, y: CY + 70, p: 0.3 }, { x: CX + 380, y: CY - 90, p: 2.1 }, { x: CX + 40, y: CY + 300, p: 4.4 }, { x: CX - 620, y: CY - 300, p: 1.2 }];
// Forest
const TREES = (() => { const r = rng(17), out = [];
  for (let i = 0; i < 95; i++) {
    const d = .25 + r() * .75;
    out.push({ x: r() * W * 1.6 - W * .3, d, h: H * (.45 + r() * .7) * (0.7 + d * .4), w: 2 + d * 11, del: r() * .45,
      br: Array.from({ length: 2 + Math.floor(r() * 4) }, () => ({ y: .35 + r() * .55, l: 20 + r() * 70, s: r() < .5 ? -1 : 1 })) });
  }
  return out.sort((a, b) => a.d - b.d); })();

/* ───────────── Primitives ───────────── */
const hasLS = 'letterSpacing' in ctx;
function text(str, x, y, o = {}) {
  const { size = 40, font = FONT.body, weight = 400, color = C.paper, alpha = 1, align = 'center', ls = 0, base = 'alphabetic' } = o;
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  if (hasLS) ctx.letterSpacing = `${ls}px`;
  ctx.fillText(str, align === 'center' && hasLS ? x + ls / 2 : x, y);
  ctx.restore();
}
// Line of text that rises word by word out of a mask; `hl` words are painted ambre.
function riseLine(str, x, y, size, prog, o = {}) {
  if (prog <= 0) return;
  const { font = FONT.display, weight = 500, color = C.paper, hl = [], align = 'center', alpha = 1 } = o;
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`; if (hasLS) ctx.letterSpacing = '0px';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const words = str.split(' '), sp = ctx.measureText(' ').width, ws = words.map(w => ctx.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = align === 'center' ? x - total / 2 : x;
  words.forEach((w, i) => {
    const st = (i / words.length) * .5, lp = E.p4o(seg(prog, st, st + .5));
    if (lp > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - 6, y - size * 1.1, ws[i] + 12, size * 1.42); ctx.clip();
      ctx.globalAlpha *= lp; ctx.fillStyle = hl.includes(i) ? C.ambre : color;
      ctx.fillText(w, cx, y + (1 - lp) * size * .9); ctx.restore();
    }
    cx += ws[i] + sp;
  });
  ctx.restore();
}
function enso(cx, cy, R, prog, color, alpha = 1, width = 46) {
  if (prog <= 0 || alpha <= 0) return;
  ctx.save(); ctx.fillStyle = color;
  const n = Math.floor(ENSO.length * prog);
  for (const [off, jit, al] of BRISTLES) {
    ctx.globalAlpha = alpha * al * .9; ctx.beginPath();
    for (let i = 0; i < n; i++) {

function maskedTitle(str, cx, baseline, size, prog, color, ls) {

}
function glyph(ch, x, y, size, color, alpha) {

function shapePath(t, x, y, s) {

    for (let k = 0; k < 3; k++) { const a = rot + k * Math.PI * 2 / 3; k ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } }

}

function forest(t) {
  const g = S.trees, a = 1 - S.treesOut;
  if (g <= 0 || a <= 0) return;
  const travel = S.travel;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const x = 300 + i * 290 - travel * 900 * (.3 + i * .05);
    const xx = ((x % (W + 600)) + W + 600) % (W + 600) - 300;
    const gr = ctx.createLinearGradient(xx, 0, xx - 380, H);
    gr.addColorStop(0, rgba(C.ambre, .10 * g * a * (1 - S.dark * .6))); gr.addColorStop(1, rgba(C.ambre, 0));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(xx, 0); ctx.lineTo(xx + 90, 0); ctx.lineTo(xx - 300, H); ctx.lineTo(xx - 420, H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.lineCap = 'round';
  const span = W * 1.6;
  for (const tr of TREES) {
    const gp = E.p3o(seg(g, tr.del, tr.del + .55));
    if (gp <= 0) continue;
    const x = ((tr.x - travel * 5200 * tr.d) % span + span) % span - W * .3;
    if (x < -120 || x > W + 120) continue;
    const top = H - tr.h * gp, base = a * (.25 + tr.d * .6);
    ctx.strokeStyle = mix(C.bosc2, C.paper, .12 + tr.d * .5); ctx.globalAlpha = base;
    const blur = Math.min(60, travel * travel * 140 * tr.d);
    ctx.lineWidth = tr.w;
    ctx.beginPath(); ctx.moveTo(x, H + 10); ctx.lineTo(x, top); ctx.stroke();
    if (blur > 2) { ctx.globalAlpha = base * .25; ctx.lineWidth = tr.w + blur; ctx.beginPath(); ctx.moveTo(x + blur * .5, H + 10); ctx.lineTo(x + blur * .5, top); ctx.stroke(); ctx.globalAlpha = base; }
    ctx.lineWidth = Math.max(1, tr.w * .35);
    for (const b of tr.br) {
      const by = H - tr.h * b.y * gp;
      if (by < top) continue;
      ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + b.s * b.l * tr.d * gp, by - b.l * .6 * gp); ctx.stroke();
    }
  }
  ctx.restore();
  const gr = ctx.createLinearGradient(0, H * .55, 0, H); gr.addColorStop(0, rgba(C.nit, 0)); gr.addColorStop(1, rgba(C.nit, .65 * g * a));
  ctx.fillStyle = gr; ctx.fillRect(0, H * .55, W, H * .45);
}

const $ = id => document.getElementById(id);
const scrub = $('scrub'), tc = $('tc'), playBtn = $('play'), big = $('bigplay'), status = $('status');

const voList = $('voList');
VO.forEach(v => {
  const li = document.createElement('li'), b = document.createElement('button');
  const ts = document.createElement('span'); ts.className = 't'; ts.textContent = '00:' + v.at.toFixed(1).padStart(4, '0');
  const tx = document.createElement('span'); tx.textContent = v.text;

});

function timecode(t) { const s = Math.floor(t), f = Math.floor((t - s) * 30); return `00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`; }
function syncUI(t) {
  if (!scrubbing) scrub.value = t.toFixed(2);
  tc.textContent = timecode(t);
  const idx = t < 15 ? 0 : t < 40 ? 1 : t < 55 ? 2 : 3;
  actBtns.forEach((b, i) => b.classList.toggle('on', i === idx));
  let cur = -1; VO.forEach((v, i) => { if (t >= v.at) cur = i; });
  voBtns.forEach((b, i) => b.classList.toggle('on', i === cur && started));
}
function setPlaying(p) { playBtn.textContent = p ? '❚❚ Pausa' : '▶ Play'; big.hidden = p; }
function play() { if (!started || tl.time() >= DUR - .01) { tl.seek(0); started = true; } tl.play(); setPlaying(true); }
function pause() { tl.pause(); setPlaying(false); }
function toggle() { tl.paused() ? play() : pause(); }
function seek(t) { tl.seek(clamp(t, 0, DUR)); }
tl.eventCallback('onComplete', () => setPlaying(false));
playBtn.addEventListener('click', toggle);
big.addEventListener('click', play);
scrub.addEventListener('pointerdown', () => { scrubbing = true; });
scrub.addEventListener('input', () => { if (!tl.paused()) pause(); started = true; seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', () => { scrubbing = false; });
const jump = t => { started = true; seek(t); play(); };
[...actBtns, ...voBtns].forEach(b => b.addEventListener('click', () => jump(+b.dataset.t)));
document.querySelectorAll('.shot').forEach(b => b.addEventListener('click', () => { jump(+b.dataset.t); $('stageBox').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }); }));
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); started = true; seek(tl.time() + 5); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); started = true; seek(tl.time() - 5); }
});
$('full').addEventListener('click', () => {
  const el = $('stageBox');
  const p = document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen ? el.requestFullscreen() : null);
  if (p && p.catch) p.catch(() => { status.textContent = 'Aquest visor no permet pantalla completa.'; });
});

// Frame-accurate hook used by scripts/render.mjs
window.seekTo = t => { tl.pause(); seek(t); render(tl.time()); return tl.time(); };

function loop() { const t = tl.time(); render(t); syncUI(t); requestAnimationFrame(loop); }
const glyphs = '道場 àèéíòóúÀÈÉÍÒÓÚïüç·\'SHINDOJ0123456789';
window.fontsReady = Promise.race([
  Promise.all(['800 100px "Shippori Mincho B1"', '500 100px "Shippori Mincho B1"', '400 40px "Zen Kaku Gothic New"', '700 40px "Zen Kaku Gothic New"', '400 40px "DM Mono"', '500 40px "DM Mono"'].map(f => document.fonts.load(f, glyphs))),
  new Promise(r => setTimeout(r, 4000)),
]).catch(() => {}).then(() => { seek(9.8); requestAnimationFrame(loop); return true; });
})();
</script>
